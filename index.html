<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#080a1b">
<title>MILE 첫걸음 상점</title>
<style>
:root {
  --bg: #080a1b;
  --bg-2: #0e1131;
  --white: #f5f4ff;
  --muted: #b7bbd5;
  --dim: #7f85b3;
  --lavender: #c5c6ff;
  --blue: #9baeff;
  --pink: #f0c4ff;
  --cyan: #9fe0ff;
  --gold: #ffe6a6;
  --gold-deep: #ffd27a;
  --good: #a9f0cf;
  --bad: #ffb3c1;
  --serif: "Noto Serif KR", "Nanum Myeongjo", "AppleMyungjo", "Batang", "Source Han Serif K", serif;
  --sans: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }

body {
  margin: 0;
  background: #04050f;
  color: var(--white);
  font-family: var(--sans);
  font-weight: 300;
  touch-action: manipulation;
  user-select: none;
  -webkit-user-select: none;
  overflow: hidden;
}

button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; touch-action: manipulation; }
svg { display: block; }

/* 세로 화면 기준 게임 판 (360~430px) */
#app {
  position: relative;
  width: 100%;
  max-width: 430px;
  height: 100%;
  min-height: 600px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background:
    radial-gradient(ellipse 80% 40% at 20% 8%, #3b2f8a55, transparent 70%),
    radial-gradient(ellipse 70% 40% at 90% 45%, #2a4aa04a, transparent 70%),
    radial-gradient(ellipse 90% 50% at 50% 105%, #5b3fa040, transparent 70%),
    linear-gradient(180deg, #0a0c22 0%, var(--bg) 55%, #0b0d26 100%);
  box-shadow: 0 0 80px #000;
}

/* 은하수 · 별 · 별똥별 */
.sky { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }

.milky-way {
  position: absolute;
  left: -40%;
  top: 18%;
  width: 180%;
  height: 26%;
  rotate: -24deg;
  background:
    radial-gradient(ellipse 50% 45% at 50% 50%, #d6ceff38, transparent 70%),
    radial-gradient(ellipse 25% 35% at 32% 55%, #9baeff30, transparent 70%),
    radial-gradient(ellipse 22% 30% at 70% 45%, #f0c4ff28, transparent 70%);
  filter: blur(14px);
  animation: milky 14s ease-in-out infinite alternate;
}

.sky i {
  position: absolute;
  width: var(--s);
  height: var(--s);
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 0 6px #dfe3ff;
  animation: twinkle var(--t) ease-in-out var(--d) infinite alternate;
}

.sky i.big::before, .sky i.big::after {
  content: "";
  position: absolute;
  left: 50%;
  top: 50%;
  width: 9px;
  height: 1px;
  translate: -50% -50%;
  background: linear-gradient(90deg, transparent, #fff, transparent);
}

.sky i.big::after { rotate: 90deg; }

.meteor {
  position: absolute;
  top: 6%;
  left: 110%;
  width: 120px;
  height: 1.5px;
  rotate: -28deg;
  background: linear-gradient(90deg, #fff, #c5c6ff88 25%, transparent);
  box-shadow: 0 0 6px #fff;
  animation: meteor 9s ease-in 3s infinite;
}

.meteor.two { top: 30%; animation-duration: 13s; animation-delay: 8s; }

/* 상단 정보 */
.hud {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: max(12px, env(safe-area-inset-top)) 14px 6px;
}

.day {
  font-family: var(--serif);
  font-size: 15px;
  font-weight: 400;
  letter-spacing: -.02em;
  color: var(--white);
}

.day small {
  display: block;
  font-family: var(--sans);
  font-size: 10px;
  letter-spacing: .16em;
  color: var(--lavender);
}

.stats { display: flex; gap: 6px; }

.stat {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 5px 10px 5px 7px;
  border-radius: 999px;
  background: #ffffff0d;
  border: 1px solid #dfe3ff26;
  font-size: 12.5px;
}

.stat svg { width: 17px; height: 17px; }
.stat b { font-weight: 600; color: var(--gold); font-variant-numeric: tabular-nums; }
.stat.bump { animation: bump .45s; }

.queue {
  position: relative;
  display: flex;
  gap: 5px;
  padding: 2px 14px 0;
}

.queue span {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  border: 1px solid #c5c6ff66;
}

.queue span.done { background: var(--lavender); box-shadow: 0 0 6px var(--lavender); border-color: transparent; }
.queue span.now { background: var(--gold); box-shadow: 0 0 8px var(--gold); border-color: transparent; }

/* 손님 카운터 */
.counter {
  position: relative;
  height: 214px;
  margin: 8px 12px 0;
  flex-shrink: 0;
}

.glass {
  background: linear-gradient(135deg, #ffffff16, #ffffff06), #0d1030a8;
  border: 1px solid #dce1ff2b;
  backdrop-filter: blur(16px) saturate(140%);
  -webkit-backdrop-filter: blur(16px) saturate(140%);
  box-shadow: inset 0 1px 0 #ffffff14, 0 14px 40px #02030e66;
}

.bubble {
  position: absolute;
  left: 0;
  right: 104px;
  top: 4px;
  min-height: 116px;
  padding: 13px 15px;
  border-radius: 20px 20px 6px 20px;
  font-family: var(--serif);
  font-size: 14.5px;
  font-weight: 400;
  line-height: 1.6;
  letter-spacing: -.02em;
  word-break: keep-all;
  transition: opacity .3s, transform .3s;
}

.bubble::after {
  content: "";
  position: absolute;
  right: -7px;
  bottom: 16px;
  width: 12px;
  height: 12px;
  rotate: 45deg;
  background: #1a1d45;
  border-top: 1px solid #dce1ff2b;
  border-right: 1px solid #dce1ff2b;
}

.bubble.hide { opacity: 0; transform: translateY(6px) scale(.97); }
.bubble p { margin: 0; }
.bubble.react p { color: var(--gold); }

.tag {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  margin-bottom: 5px;
  padding: 2px 9px;
  border-radius: 999px;
  border: 1px solid #f0c4ff66;
  background: #f0c4ff14;
  color: var(--pink);
  font-family: var(--sans);
  font-size: 10.5px;
  font-weight: 500;
}

.tag:empty { display: none; }

.customer {
  position: absolute;
  right: 0;
  top: 0;
  width: 100px;
  text-align: center;
  transition: transform .5s cubic-bezier(.3,1.35,.5,1), opacity .35s;
}

.customer.out { transform: translateX(130px); opacity: 0; }

.avatar {
  width: 96px;
  height: 108px;
  margin: 0 auto;
  animation: idle 2.6s ease-in-out infinite alternate;
}

.name {
  margin-top: 2px;
  font-size: 11px;
  color: var(--muted);
  white-space: nowrap;
}

.patience {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 20px;
  height: 8px;
  border-radius: 999px;
  background: #ffffff10;
  border: 1px solid #ffffff1c;
  overflow: hidden;
}

.patience-fill {
  height: 100%;
  width: 100%;
  border-radius: inherit;
  background: linear-gradient(90deg, var(--blue), var(--lavender), var(--gold));
  box-shadow: 0 0 12px var(--lavender);
}

.patience-fill.warn { background: linear-gradient(90deg, var(--pink), var(--gold)); box-shadow: 0 0 12px var(--pink); }
.patience-fill.danger { background: linear-gradient(90deg, #ff8fb0, var(--bad)); box-shadow: 0 0 12px #ff8fb0; }

.patience-label {
  position: absolute;
  left: 2px;
  bottom: 0;
  font-size: 10.5px;
  letter-spacing: .04em;
  color: var(--dim);
}

/* 키트 상자 */
.kit {
  position: relative;
  margin: 0 12px;
  padding: 10px 12px 12px;
  border-radius: 20px;
  flex-shrink: 0;
  overflow: hidden;
}

.kit::before {
  content: "";
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse at 80% 0%, #9baeff26, transparent 60%);
  pointer-events: none;
}

.kit-title {
  position: relative;
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 8px;
  font-family: var(--serif);
  font-size: 14px;
  font-weight: 400;
}

.kit-title span { font-family: var(--sans); font-size: 10.5px; color: var(--dim); }

.kit-items {
  position: relative;
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  min-height: 38px;
  align-content: flex-start;
}

.kit-empty { font-size: 12px; color: var(--dim); align-self: center; }

.kit-chip {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 5px 9px 5px 5px;
  border-radius: 999px;
  border: 1px solid color-mix(in srgb, var(--c) 60%, transparent);
  background: color-mix(in srgb, var(--c) 14%, transparent);
  font-size: 12px;
  font-weight: 400;
}

.kit-chip.fresh { animation: pop .25s ease-out; }

.kit-chip svg { width: 22px; height: 22px; color: var(--c); filter: drop-shadow(0 0 4px var(--c)); }
.kit-chip .x { color: var(--dim); font-size: 10px; margin-left: 1px; }

/* 버튼 */
.actions {
  display: grid;
  grid-template-columns: .9fr 1.4fr 1.2fr;
  gap: 7px;
  margin: 10px 12px 0;
  flex-shrink: 0;
}

.btn {
  position: relative;
  padding: 12px 6px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 500;
  overflow: hidden;
  transition: transform .12s, opacity .2s, box-shadow .2s;
}

.btn:active:not(:disabled) { transform: scale(.96); }
.btn:disabled { opacity: .38; }

.btn-ghost { background: #ffffff0d; border: 1px solid #dfe3ff30; }
.btn-wrong { background: #f0c4ff14; border: 1px solid #f0c4ff55; color: var(--pink); }

.btn-serve {
  color: #1a1640;
  font-weight: 700;
  background: linear-gradient(135deg, #fff4cf, var(--gold) 45%, var(--gold-deep));
  box-shadow: 0 0 22px #ffe6a666, inset 0 1px 0 #ffffffaa;
}

.btn-serve::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(115deg, transparent 30%, #ffffffa0 50%, transparent 70%);
  translate: -120% 0;
  animation: shine 3.8s ease-in-out 1s infinite;
}

/* 은하수 진열대 */
.shelf-wrap {
  position: relative;
  flex: 1;
  margin-top: 12px;
  padding: 10px 12px max(14px, env(safe-area-inset-bottom));
  border-top: 1px solid #dce1ff26;
  background:
    linear-gradient(180deg, #ffffff08, transparent 40%),
    radial-gradient(ellipse 80% 60% at 50% 0%, #6e5bd422, transparent 70%);
  overflow-y: auto;
}

.shelf-label {
  display: flex;
  justify-content: space-between;
  margin: 0 2px 8px;
  font-family: var(--serif);
  font-size: 13px;
}

.shelf-label span { font-family: var(--sans); font-size: 10.5px; color: var(--dim); }

.legend { display: flex; gap: 10px; }
.legend b { font-weight: 400; display: inline-flex; align-items: center; gap: 4px; }
.legend b::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--c); box-shadow: 0 0 6px var(--c); }

.shelf {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}

.item {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding: 9px 3px 8px;
  border-radius: 16px;
  border: 1px solid #ffffff17;
  background: #ffffff07;
  font-size: 11px;
  font-weight: 400;
  line-height: 1.25;
  text-align: center;
  word-break: keep-all;
  transition: transform .15s, border-color .25s, background .25s, box-shadow .25s;
  animation: bob 4s ease-in-out var(--d) infinite alternate;
}

.item .orb {
  display: grid;
  place-items: center;
  width: 42px;
  height: 42px;
  border-radius: 50%;
  color: var(--c);
  background: radial-gradient(circle, color-mix(in srgb, var(--c) 30%, transparent), transparent 70%);
}

.item .orb svg { width: 28px; height: 28px; filter: drop-shadow(0 0 5px var(--c)); }
.item:active { transform: scale(.95); }

.item.in {
  border-color: var(--gold);
  background: #ffe6a614;
  box-shadow: 0 0 18px #ffe6a640, inset 0 0 12px #ffe6a614;
}

.item.in .orb {
  color: #fff8e1;
  background: radial-gradient(circle, #ffe6a6 0%, #ffe6a655 40%, transparent 72%);
}

.item.in .orb svg { filter: drop-shadow(0 0 6px var(--gold)); }

.item.in::after {
  content: "✦";
  position: absolute;
  top: 4px;
  right: 7px;
  font-size: 10px;
  color: var(--gold);
}


/* 알림 */
.toast {
  position: absolute;
  left: 50%;
  top: 74px;
  z-index: 30;
  translate: -50% 0;
  width: max-content;
  max-width: 88%;
  padding: 10px 16px;
  border-radius: 16px;
  font-size: 13px;
  font-weight: 500;
  text-align: center;
  word-break: keep-all;
  opacity: 0;
  transform: translateY(-8px);
  transition: opacity .25s, transform .25s;
  pointer-events: none;
}

.toast.show { opacity: 1; transform: none; }
.toast .gain { display: block; margin-top: 2px; font-size: 12px; color: var(--gold); font-weight: 400; }

.burst {
  position: absolute;
  z-index: 25;
  color: var(--gold);
  font-size: 13px;
  text-shadow: 0 0 8px currentColor;
  pointer-events: none;
  animation: burst .9s ease-out forwards;
}

/* 안내창 */
.overlay {
  position: absolute;
  inset: 0;
  z-index: 40;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 18px;
  background: #04050fcc;
  backdrop-filter: blur(5px);
  -webkit-backdrop-filter: blur(5px);
}

.overlay[hidden] { display: none; }

.card {
  position: relative;
  width: 100%;
  max-height: 100%;
  overflow-y: auto;
  padding: 24px 18px 20px;
  border-radius: 26px;
  text-align: center;
  animation: pop .4s ease-out;
}

.card::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background: radial-gradient(ellipse at 50% 0%, #8f8cff2e, transparent 60%);
  pointer-events: none;
}

.card > * { position: relative; }

.card h1, .card h2 {
  margin: 0;
  font-family: var(--serif);
  font-weight: 400;
  letter-spacing: -.04em;
  line-height: 1.4;
  word-break: keep-all;
}

.card h1 { font-size: 27px; }
.card h2 { font-size: 22px; }
.card .sub { margin: 8px 0 0; font-size: 13px; color: var(--muted); line-height: 1.7; word-break: keep-all; }
.card .sub b { color: var(--white); font-weight: 500; }
.eyebrow { font-size: 10.5px; letter-spacing: .2em; color: var(--lavender); margin-bottom: 8px; }

.hero-icon { width: 92px; height: 92px; margin: 0 auto 8px; }

.how {
  margin: 16px 0 0;
  padding: 12px 14px;
  border-radius: 16px;
  border: 1px solid #ffffff14;
  background: #ffffff08;
  text-align: left;
  font-size: 12.5px;
  line-height: 1.7;
  list-style: none;
  color: var(--muted);
  word-break: keep-all;
}

.how li::before { content: "✦ "; color: var(--gold); }
.how b { color: var(--white); font-weight: 500; }

.new-items {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 6px;
  margin-top: 14px;
}

.summary {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
  margin-top: 14px;
}

.summary div {
  padding: 10px 4px;
  border-radius: 14px;
  border: 1px solid #ffffff14;
  background: #ffffff08;
  font-size: 10.5px;
  color: var(--muted);
}

.summary b { display: block; font-family: var(--serif); font-size: 20px; font-weight: 400; color: var(--gold); }

.card .btn { display: block; width: 100%; margin-top: 16px; padding: 14px; font-size: 14.5px; text-decoration: none; text-align: center; }
.card .btn + .btn { margin-top: 8px; }

/* 자립의 별자리 */
.constellation {
  margin: 14px -4px 0;
  border-radius: 20px;
  border: 1px solid #ffffff14;
  background: radial-gradient(ellipse at 50% 30%, #2a2a6e, #0b0d26 78%);
  overflow: hidden;
}

.constellation svg { width: 100%; height: auto; }

.rank {
  margin: 10px 0 0;
  padding: 0;
  list-style: none;
  display: grid;
  gap: 6px;
  text-align: left;
}

.rank li {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 6px 12px 6px 6px;
  border-radius: 999px;
  border: 1px solid #ffffff14;
  background: #ffffff08;
  font-size: 12.5px;
}

.rank li > span { display: flex; align-items: center; gap: 6px; }
.rank svg { width: 26px; height: 26px; color: var(--c); filter: drop-shadow(0 0 4px var(--c)); }
.rank small { color: var(--gold); }

@keyframes twinkle { from { opacity: .15; } to { opacity: 1; } }
@keyframes milky { from { opacity: .65; translate: -3% 0; } to { opacity: 1; translate: 3% -2%; } }
@keyframes meteor {
  0%, 92% { transform: translateX(0); opacity: 0; }
  93% { opacity: 1; }
  100% { transform: translateX(-560px); opacity: 0; }
}
@keyframes idle { to { transform: translateY(-4px); } }
@keyframes bob { to { translate: 0 -2px; } }
@keyframes pop { from { transform: scale(.88); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@keyframes bump { 50% { transform: scale(1.14); box-shadow: 0 0 16px #ffe6a666; } }
@keyframes shine { 0%, 60% { translate: -120% 0; } 100% { translate: 120% 0; } }
@keyframes burst { from { opacity: 1; transform: translate(0, 0) scale(1); } to { opacity: 0; transform: translate(var(--x), var(--y)) scale(.4); } }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
@keyframes glow { from { opacity: .4; } to { opacity: 1; } }
@keyframes spin { to { rotate: 360deg; } }

.shake { animation: shake .3s; }

@media (max-width: 859px) and (max-height: 760px) {
  .hud { padding-top: max(8px, env(safe-area-inset-top)); padding-bottom: 4px; }
  .counter { height: 168px; margin-top: 4px; }
  .bubble { min-height: 88px; padding: 10px 13px; font-size: 13.5px; line-height: 1.5; }
  .avatar { width: 76px; height: 86px; }
  .customer { width: 84px; }
  .bubble { right: 90px; }
  .kit { padding: 8px 12px 9px; }
  .kit-title { margin-bottom: 6px; }
  .kit-items { min-height: 32px; }
  .actions { margin-top: 8px; }
  .btn { padding: 10px 6px; }
  .shelf-wrap { margin-top: 8px; padding-top: 8px; }
  .tabs { margin-bottom: 7px; }
  .tab { padding: 6px; }
  .shelf { gap: 6px; }
  .item { padding: 6px 3px 5px; gap: 2px; }
  .item .orb { width: 34px; height: 34px; }
  .item .orb svg { width: 24px; height: 24px; }
}

/* 키보드 단축키 표시 (마우스를 쓰는 PC에서만) */
kbd {
  display: none;
  min-width: 18px;
  padding: 0 5px;
  border-radius: 5px;
  border: 1px solid #dfe3ff40;
  background: #ffffff10;
  font-family: inherit;
  font-size: 10px;
  font-weight: 500;
  line-height: 16px;
  color: var(--muted);
  vertical-align: middle;
}

.btn-serve kbd { border-color: #1a164040; background: #1a164014; color: #1a1640aa; }
.item kbd.num { position: absolute; top: 5px; left: 6px; }

@media (hover: hover) and (pointer: fine) {
  kbd { display: inline-block; }
  .btn kbd { margin-left: 4px; }
  .item:hover:not(.in) { border-color: color-mix(in srgb, var(--c) 55%, transparent); background: #ffffff0d; }
  .btn:hover:not(:disabled), .choice:hover, .tab:hover { filter: brightness(1.12); }
}


/* 플레이어 기록 */
.player-name-input {
  display:block; width:100%; margin:14px 0 0; padding:12px 14px;
  border-radius:14px; border:1px solid #c5c6ff55; background:#ffffff0d;
  color:var(--white); font:inherit; font-size:14px; outline:none;
}
.player-name-input:focus { border-color:var(--gold); box-shadow:0 0 0 2px #ffe6a622; }
.record-btn { padding:6px 10px; border-radius:999px; border:1px solid #dfe3ff30; background:#ffffff0d; font-size:11px; white-space:nowrap; }
.record-list { margin:14px 0 0; padding:0; list-style:none; display:grid; gap:7px; text-align:left; }
.record-list li { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:10px 12px; border:1px solid #ffffff18; border-radius:14px; background:#ffffff08; font-size:12px; }
.record-list li > span:first-child { min-width:0; }
.record-list small { display:block; color:var(--muted); margin-top:3px; }

/* 소리 켜고 끄기 */
.sound {
  display: grid;
  place-items: center;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  border: 1px solid #dfe3ff26;
  background: #ffffff0d;
  color: var(--lavender);
}

.sound svg { width: 16px; height: 16px; }

/* 손님 별명 */
.name small {
  display: block;
  margin-bottom: 1px;
  font-size: 10px;
  color: var(--lavender);
  white-space: normal;
  line-height: 1.3;
  word-break: keep-all;
}

/* 손님 속마음 */
.thought {
  position: absolute;
  left: 6px;
  right: 110px;
  top: 128px;
  font-family: var(--serif);
  font-size: 12px;
  color: var(--lavender);
  opacity: 0;
  transform: translateY(-4px);
  transition: opacity .3s, transform .3s;
  pointer-events: none;
  word-break: keep-all;
}

.thought.show { opacity: .95; transform: none; }

/* 콤보 · 별똥별 피버 */
.combo {
  margin-left: auto;
  margin-right: 8px;
  padding: 1px 9px;
  border-radius: 999px;
  background: linear-gradient(135deg, #fff4cf, var(--gold));
  color: #1a1640;
  font-family: var(--sans);
  font-size: 11px;
  font-weight: 700;
  animation: pop .3s ease-out;
}

.combo:empty { display: none; }

.fever-banner {
  position: absolute;
  z-index: 35;
  left: 50%;
  top: 40%;
  translate: -50% -50%;
  padding: 14px 26px;
  border-radius: 999px;
  background: linear-gradient(135deg, #fff4cf, var(--gold) 50%, var(--gold-deep));
  color: #1a1640;
  font-family: var(--serif);
  font-size: 22px;
  font-weight: 700;
  white-space: nowrap;
  box-shadow: 0 0 60px #ffe6a6aa;
  pointer-events: none;
  animation: feverIn 1.6s ease-out forwards;
}

#app.fever .kit { border-color: #ffe6a6aa; box-shadow: 0 0 28px #ffe6a655, inset 0 0 24px #ffe6a61a; }
#app.fever .meteor { animation-duration: 2.4s; animation-delay: 0s; background: linear-gradient(90deg, #fff4cf, #ffe6a6aa 25%, transparent); }
#app.fever .milky-way { filter: blur(14px) hue-rotate(-25deg) brightness(1.4); }

/* 기숙사 고양이 */
.customer.cat .avatar { cursor: pointer; }
.customer.cat .avatar:active { transform: scale(.95); }
.purr { animation: purr .25s ease-in-out 4; }

@keyframes feverIn {
  0% { opacity: 0; transform: scale(.6); }
  20% { opacity: 1; transform: scale(1.08); }
  75% { opacity: 1; transform: scale(1); }
  100% { opacity: 0; transform: scale(1.1); }
}

@keyframes purr { 50% { transform: rotate(-4deg) scale(1.05); } }

/* PC: 넓은 화면에서는 손님·키트(왼쪽)와 진열대(오른쪽)를 나란히 */
@media (min-width: 860px) and (min-height: 560px) {
  #app {
    max-width: 1180px;
    display: grid;
    grid-template-columns: minmax(380px, 1fr) minmax(440px, 1.15fr);
    grid-template-rows: auto auto auto auto auto;
    align-content: center;
    grid-template-areas: "hud hud" "sub sub" "counter shelf" "kit shelf" "actions shelf";
    column-gap: 24px;
    padding: 0 26px 26px;
  }

  .hud { grid-area: hud; padding: 20px 2px 8px; }
  .day { font-size: 19px; }
  .stat { font-size: 14px; padding: 6px 12px 6px 8px; }
  .subhud { grid-area: sub; padding: 0 2px 4px; }
  .calm { font-size: 12px; }
  .calm-bar { width: 120px; }

  .counter { grid-area: counter; height: 300px; margin: 12px 0 0; }
  .bubble { right: 160px; min-height: 160px; padding: 18px 20px; font-size: 17px; }
  .customer { width: 150px; }
  .avatar { width: 140px; height: 156px; }
  .name { font-size: 12px; }
  .thought { top: 182px; right: 165px; font-size: 13.5px; }

  .kit { grid-area: kit; margin: 14px 0 0; padding: 14px 16px 16px; }
  .kit-items { min-height: 48px; }
  .kit-chip { font-size: 13px; }
  .actions { grid-area: actions; margin: 14px 0 0; }
  .btn { padding: 14px 8px; font-size: 14.5px; }

  .shelf-wrap {
    grid-area: shelf;
    margin: 12px 0 0;
    padding: 18px;
    border: 1px solid #dce1ff2b;
    border-radius: 26px;
    background: linear-gradient(135deg, #ffffff12, #ffffff04), #0d1030a8;
    box-shadow: inset 0 1px 0 #ffffff14, 0 14px 40px #02030e66;
    display: flex;
    flex-direction: column;
  }

  .tabs { margin-bottom: 14px; }
  .shelf { flex: 1; grid-auto-rows: 1fr; }
  .item { justify-content: center; }
  .tab { padding: 10px; font-size: 14px; }
  .shelf { gap: 12px; }
  .item { padding: 16px 6px 12px; font-size: 13px; gap: 6px; }
  .item .orb { width: 60px; height: 60px; }
  .item .orb svg { width: 38px; height: 38px; }
  .item .price { font-size: 11px; }

  .toast { top: 96px; font-size: 14px; }
  .card { max-width: 520px; padding: 30px 28px 26px; }
  .card h1 { font-size: 32px; }
  .card h2 { font-size: 25px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; }
}

/* 마음 별빛 (내 마음 상태) */
.subhud {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 2px 14px 0;
}

.subhud .queue { padding: 0; }

.calm {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 10.5px;
  color: var(--muted);
}

.calm-bar {
  width: 64px;
  height: 6px;
  border-radius: 999px;
  background: #ffffff12;
  overflow: hidden;
}

.calm-fill {
  height: 100%;
  border-radius: inherit;
  background: linear-gradient(90deg, var(--cyan), var(--lavender));
  box-shadow: 0 0 8px var(--cyan);
  transition: width .5s;
}

.calm-fill.tired { background: linear-gradient(90deg, #ff8fb0, var(--bad)); box-shadow: 0 0 8px #ff8fb0; }

.breath {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 4px 9px;
  border-radius: 999px;
  border: 1px solid #9fe0ff55;
  background: #9fe0ff12;
  color: var(--cyan);
  font-size: 11px;
}

.breath b { font-weight: 600; }
.breath:disabled { opacity: .35; }
.breath:active:not(:disabled) { transform: scale(.95); }

.tag.hard { border-color: #ffb3c166; background: #ffb3c114; color: var(--bad); }

/* 진열대 탭 */
.tabs {
  display: flex;
  gap: 6px;
  margin: 0 0 10px;
}

.tab {
  flex: 1;
  padding: 8px 6px;
  border-radius: 999px;
  border: 1px solid #ffffff18;
  background: #ffffff06;
  font-size: 12.5px;
  color: var(--muted);
}

.tab.on {
  color: var(--white);
  border-color: color-mix(in srgb, var(--c) 70%, transparent);
  background: color-mix(in srgb, var(--c) 16%, transparent);
  box-shadow: 0 0 14px color-mix(in srgb, var(--c) 30%, transparent);
}

.tab small { color: var(--gold); margin-left: 3px; }

.item .price { font-size: 9.5px; color: var(--dim); font-variant-numeric: tabular-nums; }

/* 응대 카드 */
.cope-line {
  margin: 10px 0 0;
  padding: 14px 16px;
  border-radius: 18px;
  border: 1px solid #ffb3c140;
  background: #ffb3c10d;
  font-family: var(--serif);
  font-size: 15.5px;
  line-height: 1.6;
  word-break: keep-all;
}

.choices { display: grid; gap: 8px; margin-top: 14px; }

.choice {
  padding: 12px 14px;
  border-radius: 16px;
  border: 1px solid #dfe3ff2e;
  background: #ffffff0a;
  font-size: 13px;
  line-height: 1.5;
  text-align: left;
  word-break: keep-all;
}

.choice:active { transform: scale(.98); background: #ffffff16; }

.cope-result { margin-top: 14px; font-size: 13px; line-height: 1.6; color: var(--muted); }
.cope-result b { display: block; margin-bottom: 4px; font-size: 15px; font-weight: 500; }
.cope-result.good b { color: var(--good); }
.cope-result.bad b { color: var(--bad); }

.cope-tips {
  margin: 14px 0 0;
  padding: 12px 14px;
  border-radius: 16px;
  border: 1px solid #9fe0ff30;
  background: #9fe0ff0a;
  text-align: left;
  font-size: 12px;
  line-height: 1.7;
  color: var(--muted);
  list-style: none;
  word-break: keep-all;
}

.cope-tips li::before { content: "✦ "; color: var(--cyan); }
.keys-hint { display: none; font-size: 11.5px !important; }
@media (hover: hover) and (pointer: fine) { .keys-hint { display: block; } }
</style>

    const o = audio.createOscillator();
    const g = audio.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, audio.currentTime + start);
    g.gain.setValueAtTime(0, audio.currentTime + start);
    g.gain.linearRampToValueAtTime(vol, audio.currentTime + start + .01);
    g.gain.exponentialRampToValueAtTime(.0001, audio.currentTime + start + dur);
    o.connect(g).connect(audio.destination);
    o.start(audio.currentTime + start);
    o.stop(audio.currentTime + start + dur + .05);
    return o;
  };

  const makeQueue = (roundIndex) => {
    const round = ROUNDS[roundIndex];
    const queue = [];
    const used = new Set();
    let strange = 0, hard = 0;
    const strangePool = shuffle(STRANGE_REQUESTS);

    for (let n = 0; n < round.customers; n++) {
      const first = roundIndex === 0 && n === 0;
      if (!first && strange < MAX_STRANGE_PER_ROUND && Math.random() < STRANGE_CHANCE) {
        strange++;
        queue.push({ strange: true, text: strangePool.pop() || pick(STRANGE_REQUESTS), look: makeLook(), name: makeName(), drain: 1 });
        continue;
      }
      let req;
      for (let tries = 0; tries < 30; tries++) {
        req = pick(REQUESTS);
        if (!used.has(req)) break;
      }
      used.add(req);
      const event = !first && hard < round.difficult && Math.random() < DIFFICULT_CHANCE ? pick(DIFFICULT) : null;
      if (event) hard++;
      queue.push({ ...req, look: makeLook(), name: makeName(), event, eventDone: false, drain: event?.drain || 1 });
    }
    // 진상 손님이 하루에 최소 minDifficult명은 오도록 보장
    const spots = queue.map((c, i) => i).filter(i => !queue[i].strange && !queue[i].event && !(roundIndex === 0 && i === 0));
    while (hard < (round.minDifficult || 0) && spots.length) {
      const i = spots.splice(Math.floor(Math.random() * spots.length), 1)[0];

      queue[i].drain = queue[i].event.drain || 1;
      hard++;

    if (Math.random() < CAT.chance) {
      const at = 2 + Math.floor(Math.random() * (queue.length - 2));

    c.event && c.eventDone ? `✦ ${c.event.label}` : c.refill ? "✦ 리필 손님 · 리필 품목만 찾아요" : "";

  const showRequest = (c) => showBubble(c.text, requestTag(c), { hard: c.event && c.eventDone });

  const setMood = (mood) => {
    if (state.mood === mood) return;
    state.mood = mood;
    $("avatar").innerHTML = state.current.cat ? catSVG(mood) : avatarSVG(state.current.look, mood);
  };

  const nextCustomer = () => {
    if (state.index >= state.queue.length) return endRound();
    const c = state.current = state.queue[state.index];
    state.box = [];
    state.mood = "";
    // 일반 손님은 25초, 별똥별 피버 중 손님은 15초, 별이는 5~10초 머물러요.
    state.patienceMax = state.patience = c.cat ? 5 + Math.random() * 5 : (state.fever > 0 ? 15 : 25);
    setMood(c.event?.timing === "start" ? "upset" : "happy");
    $("custName").innerHTML = c.name;
    $("customer").classList.toggle("cat", !!c.cat);
    $("serveLabel").textContent = c.cat ? "쓰다듬기 ✦" : "건네기 ✦";
    $("wrongLabel").textContent = c.cat ? "다음에 또 와!" : "이 가게 아니에요!";
    $("customer").classList.remove("out");
    if (c.cat) setTimeout(() => sfx("meow"), 300);
    state.running = true;
    state.paused = false;

    if (c.event?.timing === "start") {
      showBubble(c.event.line, "", { react: true });
      state.paused = true;
      setTimeout(() => openCoping(c, () => showRequest(c)), 1100);
    } else {
      showRequest(c);
    }
    renderBox();
    renderHud();
    updatePatience();
    setButtons(true);
  };

  const updatePatience = () => {
    const r = Math.max(state.patience / state.patienceMax, 0);
    const fill = $("patienceFill");
    fill.style.width = `${r * 100}%`;
    fill.classList.toggle("warn", r < .55 && r >= .28);
    fill.classList.toggle("danger", r < .28);
    if (state.running && !state.paused) setMood(r < .28 ? "upset" : r < .55 ? "worry" : "happy");
  };

  // ── 진상 손님 응대 카드 ──
  const openCoping = (c, after) => {
    const ev = c.event;
    c.eventDone = true;
    state.paused = true;
    renderCalm();
    const choices = shuffle(ev.choices);
    state.onChoice = (index) => {
      const ch = choices[index];
      state.onChoice = null;
      state.copeTotal++;
      changeCalm(ch.calm || 0);
      if (ch.patience) state.patience *= ch.patience;
      let result;
      if (ch.good) {
        state.copeGood++;
        state.mile += SCORE.mileCopeGood;
        state.roundMile += SCORE.mileCopeGood;
        c.drain = 1;
        if (ch.refresh || ev.timing === "start") state.patience = Math.max(state.patience, state.patienceMax * .85);
        sfx("cope");
        result = `<div class="cope-result good"><b>침착하게 잘 응대했어요!</b>MILE +${SCORE.mileCopeGood} · 마음 별빛 ${sign(ch.calm || 0)}</div>`;
        bump("mileStat");
      } else {
        sfx("hurt");
        result = `<div class="cope-result bad"><b>마음이 조금 다쳤어요.</b>마음 별빛 ${sign(ch.calm || 0)}${ch.patience ? " · 손님 기다림이 줄었어요" : ""}${ch.coin ? " · 매출이 줄어요" : ""}${ch.mile ? " · MILE이 줄어요" : ""}</div>`;
      }
      $("card").innerHTML = `
        <div class="eyebrow">${ev.label}</div>
        <div class="cope-line">“${ch.reply}”</div>
        ${result}`;
      renderHud();
      setTimeout(() => {
        hideCard();
        state.paused = false;
        renderCalm();
        after(ch);
      }, 1700);
    };
    showCard(`
      <div class="eyebrow">진상 손님 · 응대 카드</div>
      <h2>${ev.label}</h2>
      <div class="cope-line">“${ev.line}”</div>
      <p class="sub">어떻게 대답할까요? 기다림은 잠시 멈춰 있어요.</p>
      <div class="choices">${choices.map((ch, i) => `<button class="choice" data-choice="${i}"><kbd>${i + 1}</kbd> ${ch.text}</button>`).join("")}</div>`);
  };

  const triggerMidEvent = (c) => {
    showBubble(c.event.line, "", { react: true });
    setMood("worry");
    openCoping(c, () => {
      const options = REQUESTS.filter(r => r.text !== c.text && !!r.refill === !!c.refill);
      const next = pick(options);
      c.text = next.text;
      c.needs = next.needs;
      state.box = [];
      renderBox();
      showRequest(c);
      toast("손님이 찾는 물건이 바뀌었어요.", "키트 상자를 비웠어요. 새 요청을 들어 보세요.");
    });
  };

  const showThought = (text) => {
    const t = $("thought");
    t.textContent = text;
    t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 1500);
  };

  const feverBanner = () => {
    const b = document.createElement("div");
    b.className = "fever-banner";
    b.textContent = "✦ 별똥별 피버! ✦";
    $("app").appendChild(b);
    setTimeout(() => b.remove(), 1700);
    sfx("fever");
  };

  const finish = (reaction, coins, mile, gainText, stat, mood) => {
    if (["partial", "left", "wrong"].includes(stat)) { state.combo = 0; state.fever = 0; }
    if (stat === "left") state.stats.left++;
    if (stat === "strange" && mood === "happy") state.stats.strangeRight++;
    sfx({ perfect: "perfect", partial: "partial", left: "hurt", wrong: "wrong", strange: "cope", cat: "meow" }[stat]);
    state.running = false;
    state.paused = false;
    setButtons(false);
    state.coins = Math.max(0, state.coins + coins);
    state.mile = Math.max(0, state.mile + mile);
    state.roundCoins += coins;
    state.roundMile += mile;
    state.roundStats[stat] = (state.roundStats[stat] || 0) + 1;
    setMood(mood);
    showBubble(reaction, "", { react: true });
    toast(gainText.title, gainText.detail);
    if (coins) bump("coinStat");
    if (mile) bump("mileStat");
    if (mile > 0) sparkle($("avatar"), "#ffe6a6");
    renderHud();

    setTimeout(() => {
      $("customer").classList.add("out");
      $("bubble").classList.add("hide");
      setTimeout(() => {
        state.index++;
        nextCustomer();
      }, 450);
    }, 1500);
  };

  // 건넨 키트 평가 (진상 응대 결과 mod를 반영)
  const settle = (mod = {}) => {
    const c = state.current;
    state.box.forEach(id => state.picks[id] = (state.picks[id] || 0) + 1);
    const hits = c.needs.filter(id => state.box.includes(id));
    const miss = c.needs.length - hits.length;
    const extra = state.box.filter(id => !c.needs.includes(id)).length;
    const ratio = Math.max(state.patience / state.patienceMax, 0);
    const elapsed = state.patienceMax - state.patience;
    const isFeverTimer = state.patienceMax === 15;
    const speedMul = isFeverTimer
      ? (elapsed <= 5 ? 1.5 : state.patience < 5 ? .75 : 1)
      : (elapsed <= 7 ? 1.5 : state.patience < 7 ? .75 : 1);
    const mileMul = (mod.mile || 1) * (tired() ? .5 : 1) * speedMul;
    const tiredNote = tired() ? " · 지쳐서 MILE 절반" : "";

    if (!miss && !extra) {
      const inFever = state.fever > 0;
      state.combo++;
      state.stats.perfects++;
      state.stats.maxCombo = Math.max(state.stats.maxCombo, state.combo);
      if (c.refill) state.stats.refillPerfect++;
      const comboBonus = Math.min(Math.max(state.combo - 1, 0) * COMBO.bonusPerCombo, COMBO.maxBonus);
      const tip = SCORE.tipMax * ratio * (inFever ? COMBO.feverTipMul : 1);
      const coins = Math.round((hits.reduce((a, id) => a + itemById[id].price, 0) + tip) * (mod.coin || 1) / 100) * 100;
      const mile = Math.round((SCORE.milePerfect + (ratio > .5 ? SCORE.mileFastBonus : 0) + comboBonus + (inFever ? COMBO.feverMile : 0)) * mileMul);
      if (inFever) state.fever--;
      const extras = [state.combo >= 2 && `${state.combo}콤보`, inFever && "피버"].filter(Boolean).join(" · ");
      finish(pick(PERFECT_LINES), coins, mile,
        { title: `딱 맞았어요! ✦${extras ? ` ${extras}` : ""}`, detail: `매출 +${won(coins)} · MILE +${mile}${tiredNote}` }, "perfect", "happy");
      if (Math.random() < THOUGHT_CHANCE) setTimeout(() => showThought(pick(THOUGHTS)), 350);
      if (state.combo > 0 && state.combo % COMBO.feverAt === 0) {
        state.fever = COMBO.feverCustomers;
        setTimeout(feverBanner, 300);
        renderHud();
      }
      return;
    }

    const coins = Math.max(0, Math.round((hits.reduce((a, id) => a + itemById[id].price, 0) - extra * SCORE.extraCost) * (mod.coin || 1)));
    const mile = Math.max(0, Math.round((hits.length * SCORE.milePerHit - miss * SCORE.milePerMiss - extra * SCORE.milePerExtra) * mileMul));
    const reaction = !hits.length ? "음… 제가 말한 거랑은 좀 다른 것 같아요."
      : miss && extra ? "하나는 빠졌고, 이건 필요 없는데… 그래도 고마워요."
      : miss ? "고마워요! 근데 하나가 빠진 것 같아요…"
      : "필요 없는 것까지 들어 있네요. 그래도 고마워요.";
    if (!hits.length) changeCalm(-CALM.wrongLoss);
    const parts = [miss && `빠진 물건 ${miss}개`, extra && `필요 없는 물건 ${extra}개`].filter(Boolean).join(" · ");
    finish(reaction, coins, mile, { title: parts || "조금 아쉬워요.", detail: `매출 +${won(coins)} · MILE +${mile}${tiredNote}` }, "partial", hits.length ? "worry" : "upset");
  };

  const petCat = () => {
    if (!state.running || state.paused || !state.current?.cat) return;
    state.stats.catPets++;
    changeCalm(CAT.calm);
    $("avatar").classList.add("purr");
    setTimeout(() => $("avatar").classList.remove("purr"), 1100);
    finish("그르릉… (별이가 만족한 듯 꼬리를 살랑살랑 흔들어요)", 0, CAT.mile,
      { title: "별이를 쓰다듬었어요. 마음이 말랑해졌어요.", detail: `마음 별빛 +${CAT.calm} · MILE +${CAT.mile}` }, "cat", "happy");
  };

  const serve = () => {
    if (!state.running || state.paused) return;
    const c = state.current;
    if (c.cat) return petCat();
    if (!state.box.length) {
      $("kitItems").classList.add("shake");
      setTimeout(() => $("kitItems").classList.remove("shake"), 300);
      return toast("키트 상자가 비어 있어요!");
    }

    if (c.strange) {
      state.box.forEach(id => state.picks[id] = (state.picks[id] || 0) + 1);
      changeCalm(-CALM.wrongLoss);
      return finish("어… 제가 찾던 건 이게 아닌데요?", 0, -SCORE.mileStrangeWrong,
        { title: "이 손님은 다른 가게를 찾고 있었어요.", detail: `MILE ${sign(-SCORE.mileStrangeWrong)}` }, "wrong", "worry");
    }

    // 말 바꾸는 손님은 바꾸기 전에 건네려 하면 그때 말을 바꿔요
    if (c.event?.timing === "mid" && !c.eventDone) return triggerMidEvent(c);
    if (c.event?.timing === "serve" && !c.eventDone) {
      showBubble(c.event.line, "", { react: true });
      setMood("worry");
      return openCoping(c, (ch) => settle({ coin: ch.coin, mile: ch.mile }));
    }
    settle();
  };

  const rejectCustomer = () => {
    if (!state.running || state.paused) return;
    const c = state.current;
    if (c.cat) return finish("냥! (별이가 꼬리를 한 번 흔들고 사라졌어요)", 0, 0, { title: "별이가 다음에 또 온대요." }, "cat", "worry");
    if (c.strange) {
      return finish(pick(["앗, 잘못 찾아왔나 봐요! 알려 줘서 고마워요.", "여기가 아니었군요… 다른 데 가 볼게요!"]),
        0, SCORE.mileStrangeRight, { title: "잘 알아봤어요! 여긴 그런 걸 안 팔아요.", detail: `MILE +${SCORE.mileStrangeRight}` }, "strange", "happy");
    }
    changeCalm(-CALM.wrongLoss);
    finish("네? 분명 여기서 파는 걸로 아는데요…", 0, -SCORE.mileWrongReject,
      { title: "이 손님은 우리 가게 손님이었어요!", detail: `MILE ${sign(-SCORE.mileWrongReject)}` }, "wrong", "upset");
  };

  const timeout = () => {
    const c = state.current;
    if (c.cat) return finish("하아암… (별이가 하품을 하고 떠났어요)", 0, 0, { title: "별이가 낮잠 자러 갔어요." }, "cat", "worry");
    if (c.strange) {
      return finish("흠, 여기 아닌가 보네요. 그냥 갈게요.", 0, 0, { title: "엉뚱한 손님이 스스로 떠났어요." }, "strange", "worry");
    }
    changeCalm(-CALM.leaveLoss);
    finish("너무 오래 걸려서… 다음에 올게요.", 0, -SCORE.mileLeave,
      { title: "손님이 지쳐서 떠났어요.", detail: `MILE ${sign(-SCORE.mileLeave)}` }, "left", "upset");
  };

  const breathe = () => {
    if (!state.running || state.paused || !state.breaths) return;
    state.breaths--;
    state.stats.breathsUsed++;
    sfx("breathe");
    state.patience -= CALM.breatheCost;
    changeCalm(CALM.breathe);
    if (!tired()) state.tiredWarned = false;
    sparkle($("breathBtn"), "#9fe0ff");
    toast("후— 깊게 숨을 골랐어요.", `마음 별빛 +${CALM.breathe} · 남은 숨 고르기 ${state.breaths}번`);
  };

  // ── 안내창 그림 ──
  const planetSVG = () => `
    <svg class="hero-icon" viewBox="0 0 100 100" aria-hidden="true">
      <defs>
        <radialGradient id="pl" cx=".35" cy=".3"><stop offset="0" stop-color="#fff"/><stop offset=".35" stop-color="#c5b8ff"/><stop offset="1" stop-color="#3a3a8a"/></radialGradient>
        <radialGradient id="plGlow"><stop offset="0" stop-color="#c5c6ff" stop-opacity=".5"/><stop offset="1" stop-color="#c5c6ff" stop-opacity="0"/></radialGradient>
      </defs>
      <circle cx="50" cy="50" r="48" fill="url(#plGlow)"/>
      <ellipse cx="50" cy="54" rx="40" ry="11" fill="none" stroke="#ffe6a6" stroke-opacity=".5" stroke-width="2" transform="rotate(-15 50 54)"/>
      <circle cx="50" cy="50" r="22" fill="url(#pl)"/>
      <path d="M28 60c14 7 34 6 46-4" fill="none" stroke="#ffe6a6" stroke-width="2.2" transform="rotate(-15 50 54)"/>
      <path d="M80 18l1.8 4 4 1.8-4 1.8-1.8 4-1.8-4-4-1.8 4-1.8z" fill="#ffe6a6" style="animation: glow 1.6s ease-in-out infinite alternate"/>
      <path d="M20 22l1 2.2 2.2 1-2.2 1-1 2.2-1-2.2-2.2-1 2.2-1z" fill="#fff" style="animation: glow 2.2s ease-in-out infinite alternate"/>
    </svg>`;

  const moonSVG = (full) => `
    <svg class="hero-icon" viewBox="0 0 100 100" aria-hidden="true">
      <defs><radialGradient id="mg"><stop offset="0" stop-color="#ffe6a6" stop-opacity=".45"/><stop offset="1" stop-color="#ffe6a6" stop-opacity="0"/></radialGradient></defs>
      <circle cx="50" cy="50" r="46" fill="url(#mg)"/>
      ${full
        ? `<path d="M50 14l7 21.5h22.5L61.3 49l7 21.5L50 57.3 31.7 70.5l7-21.5L20.5 35.5H43z" fill="#ffe6a6" style="filter:drop-shadow(0 0 8px #ffe6a6)"/>`
        : `<path d="M60 20a30 30 0 1 0 20 46 24 24 0 1 1-20-46z" fill="#ffe6a6" style="filter:drop-shadow(0 0 8px #ffe6a6)"/>`}
      <circle cx="22" cy="28" r="1.6" fill="#fff"/><circle cx="80" cy="76" r="1.3" fill="#fff"/><circle cx="76" cy="24" r="1" fill="#fff"/>
    </svg>`;

  // ── 영업 시작 / 마감 ──
  const showCard = (html) => {
    $("card").innerHTML = html;
    $("overlay").hidden = false;
  };

  const hideCard = () => { $("overlay").hidden = true; };

  const startRound = (n) => {
    state.round = n;
    state.queue = makeQueue(n);
    state.index = 0;
    state.roundCoins = 0;
    state.roundMile = 0;
    state.roundStats = { perfect: 0, partial: 0, left: 0, strange: 0, wrong: 0 };
    state.box = [];
    state.calm = CALM.max;
    state.breaths = CALM.breathsPerDay;
    state.tiredWarned = false;
    state.tab = "life";
    state.combo = 0;
    state.fever = 0;
    renderBox();
    renderHud();

    showCard(`
      <div class="eyebrow">${ROUNDS[n].label}</div>
      ${n === 0 ? planetSVG() : moonSVG(true)}
      <h2>${n === 0 ? "별빛 상점의 문을 열어요" : "마지막 날 밤이에요"}</h2>
      <p class="sub">오늘은 손님 <b>${ROUNDS[n].customers}명</b>이 찾아와요.<br>${n === 0
        ? `진열대에 기본 품목 ${ITEMS.filter(i => i.type === "basic").length}가지와 리필 ${ITEMS.filter(i => i.type === "refill").length}가지가 모두 준비돼 있어요.`
        : "손님이 더 많아지고, 기다려 주는 시간은 짧아져요."}</p>
      <div class="how" style="margin-top:12px"><b>오늘의 기숙사 소식</b><br>${pick(DORM_NEWS)}</div>
      <ul class="cope-tips">
        <li>곤란한 말을 하는 <b>진상 손님</b>이 올 수 있어요. 응대 카드에서 차분한 대답을 골라 보세요.</li>
        <li>마음 별빛이 줄어 지치면 MILE을 절반만 받아요. <b>숨 고르기</b>는 하루 ${CALM.breathsPerDay}번이에요.</li>
      </ul>
      <button class="btn btn-serve" data-act="open">가게 열기 ✦ <kbd>Enter</kbd></button>`);
  };

  const endRound = () => {
    state.running = false;
    renderHud();
    const s = state.roundStats;
    const last = state.round === ROUNDS.length - 1;
    const great = s.perfect >= ROUNDS[state.round].customers - 2;
    showCard(`
      <div class="eyebrow">${ROUNDS[state.round].label} · 마감</div>
      ${moonSVG(great)}
      <h2>${great ? "오늘 장사 아주 잘했어요!" : "오늘도 수고 많았어요"}</h2>
      <div class="summary">
        <div><b>${s.perfect}</b>딱 맞게</div>
        <div><b>${s.partial}</b>조금 아쉽게</div>
        <div><b>${s.left}</b>떠난 손님</div>
      </div>
      <p class="sub">오늘 매출 <b>${won(state.roundCoins)}</b>, MILE <b>${sign(state.roundMile)}</b>을 모았어요.${s.strange ? `<br>엉뚱한 손님 ${s.strange}명도 잘 돌려보냈어요.` : ""}${s.cat ? "<br>기숙사 고양이 별이도 다녀갔어요." : ""}</p>
      <ul class="cope-tips">
        <li>${state.calm >= 60 ? "오늘은 마음 별빛을 잘 지켰어요." : "오늘은 마음이 많이 지쳤어요. 내일은 숨 고르기를 아끼지 말아요."}</li>
        <li>힘든 손님의 말은 나를 향한 게 아니라 상황을 향한 거예요. 한 번 숨을 고르고 차분하게 대답해요.</li>
      </ul>
      <button class="btn btn-serve" data-act="${last ? "final" : "next"}">${last ? "자립의 별자리 보기 ✦" : "다음 날 준비하기"} <kbd>Enter</kbd></button>`);
  };

  const constellationSVG = (lit) => {
    const pts = [[48, 150], [118, 100], [196, 128], [262, 50]];
    const band = `<path d="M-20 190 C 80 120, 200 140, 330 20" stroke="#d6ceff" stroke-opacity=".12" stroke-width="44" fill="none" style="filter:blur(8px)"/>`;
    const lines = pts.slice(1).map((p, i) => {
      const a = pts[i];
      const on = i + 1 < lit;
      return `<line x1="${a[0]}" y1="${a[1]}" x2="${p[0]}" y2="${p[1]}" stroke="${on ? "#ffe6a6" : "#ffffff"}" stroke-opacity="${on ? .75 : .16}" stroke-width="1.6" ${on ? "" : 'stroke-dasharray="3 5"'}/>`;
    }).join("");
    const star = (x, y, r) => `M${x} ${y - r}C${x + r * .18} ${y - r * .18} ${x + r * .18} ${y - r * .18} ${x + r} ${y}C${x + r * .18} ${y + r * .18} ${x + r * .18} ${y + r * .18} ${x} ${y + r}C${x - r * .18} ${y + r * .18} ${x - r * .18} ${y + r * .18} ${x - r} ${y}C${x - r * .18} ${y - r * .18} ${x - r * .18} ${y - r * .18} ${x} ${y - r}z`;
    const stars = pts.map(([x, y], i) => {
      const on = i < lit;
      return `<g>
        ${on ? `<circle cx="${x}" cy="${y}" r="24" fill="#ffe6a6" opacity=".22" style="animation: glow ${1.4 + i * .3}s ease-in-out infinite alternate"/>` : ""}
        <path d="${star(x, y, on ? 13 : 8)}" fill="${on ? "#ffe6a6" : "#5d6496"}" ${on ? 'style="filter:drop-shadow(0 0 6px #ffe6a6)"' : ""}/>
        <text x="${x}" y="${y + 30}" text-anchor="middle" font-size="11" font-family="Noto Serif KR, serif" fill="${on ? "#fff3c4" : "#7d84b8"}">${STAR_NAMES[i]}</text>
      </g>`;
    }).join("");
    const dust = Array.from({ length: 36 }, () =>
      `<circle cx="${(Math.random() * 310).toFixed(0)}" cy="${(Math.random() * 200).toFixed(0)}" r="${(Math.random() * 1.1 + .3).toFixed(1)}" fill="#fff" opacity="${(Math.random() * .5 + .2).toFixed(2)}"/>`).join("");
    return `<svg viewBox="0 0 310 200" role="img" aria-label="별 ${lit}개가 켜진 자립의 별자리">${band}${dust}${lines}${stars}</svg>`;
  };

  // 기록은 현재 탭을 사용하는 동안만 유지하고, 탭/창을 닫으면 사라지도록 sessionStorage에 저장해요.
  // 이전 버전의 localStorage 기록은 이번 세션으로 한 번 옮긴 뒤 영구 저장소에서 지워요.
  const loadRecords = () => {
    try {
      const current = sessionStorage.getItem("mileShopRecords");
      if (current !== null) return JSON.parse(current || "[]");
      const previous = localStorage.getItem("mileShopRecords");
      if (previous !== null) {
        sessionStorage.setItem("mileShopRecords", previous);
        localStorage.removeItem("mileShopRecords");
        return JSON.parse(previous || "[]");
      }
      return [];
    } catch (e) { return []; }
  };

  // 순위는 매출과 MILE 환산액을 합산해 계산해요. 1 MILE = 100원.
  const recordTotal = (record) => (Number(record.coins) || 0) + (Number(record.score) || 0) * 100;
  const sortRecords = (records) => records.slice().sort((a, b) => recordTotal(b) - recordTotal(a));

  const recordsMarkup = (heading = true) => {
    const records = sortRecords(loadRecords()).slice(0, 10);
    return `${heading ? '<p class="sub" style="margin-top:18px"><b>순위</b></p>' : ''}
      ${records.length ? `<ol class="record-list">${records.map((r, i) => `
        <li><span><b>${i + 1}. ${escapeText(r.name || "이름 없는 점장")}</b><small>${escapeText(r.date || "기록")}</small></span><span class="record-score">금액 ${won(r.coins || 0)}&nbsp; MILE ${Number(r.score) || 0}</span></li>`).join("")}</ol>`
        : `<p class="sub">아직 기록이 없어. 게임을 끝내면 매출과 MILE 환산액 합계로 순위가 기록돼!</p>`}`;
  };

  const saveRecord = () => {
    if (state.recordSaved) return;
    const records = loadRecords();
    records.push({
      name: state.playerName || "이름 없는 점장",
      score: state.mile,
      calm: state.calm,
      coins: state.coins,
      date: new Date().toLocaleDateString("ko-KR")
    });
    const sorted = sortRecords(records);
    try { sessionStorage.setItem("mileShopRecords", JSON.stringify(sorted.slice(0, 50))); } catch (e) {}
    state.recordSaved = true;
  };

  const showRecords = (returnToGame = false) => {
    showCard(`
      <div class="eyebrow">MILE FIRST STEP SHOP</div>
      <h2>점장 기록</h2>
      <p class="sub">매출에 MILE 환산액을 더한 합계가 높은 순서야. 1 MILE은 100원으로 계산해.</p>
      ${recordsMarkup(false)}
      <button class="btn btn-serve" data-act="closeRecords">${returnToGame ? "게임으로 돌아가기" : "닫기"}</button>`);
    state.recordsReturnToGame = returnToGame;
  };

  const escapeText = (value) => String(value).replace(/[&<>"']/g, ch => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[ch]));

  const showFinal = () => {
    // 최종 결과 화면에 들어올 때 기록을 저장해요.
    saveRecord();
    const lit = 1 + STAR_THRESHOLDS.filter(t => state.mile >= t).length;
    const top = Object.entries(state.picks).sort((a, b) => b[1] - a[1]).slice(0, 3);
    const titleStats = { ...state.stats, copeGood: state.copeGood, copeTotal: state.copeTotal };
    const earned = TITLES.filter(t => t.test(titleStats)).slice(0, 3);
    const titles = earned.length ? earned : [DEFAULT_TITLE];
    const messages = [
      "첫 별이 켜졌어요. 시작이 반이에요!",
      "별 두 개가 이어졌어요. 생활이 조금씩 자리를 잡고 있어요.",
      "별 세 개! 이제 스스로 꾸려 가는 하루가 익숙해졌어요.",
      "별자리가 완성됐어요! 자립을 향한 첫걸음, 정말 멋졌어요."
    ];
    showCard(`
      <div class="eyebrow">2일 영업 끝</div>
      <h2>자립으로 가는 별자리</h2>
      <div class="constellation">${constellationSVG(lit)}</div>
      <p class="sub"><b>${messages[lit - 1]}</b></p>
      <div class="summary">
        <div><b>${state.mile}</b>총 MILE</div>
        <div><b style="font-size:16px">${won(state.coins)}</b>총 매출</div>
        <div><b>${lit}/4</b>켜진 별</div>
      </div>
      ${recordsMarkup(true)}
      <p class="sub">${state.copeTotal
        ? `진상 손님 ${state.copeTotal}명 중 <b>${state.copeGood}명</b>을 침착하게 응대했어요.`
        : "이번엔 진상 손님이 오지 않았어요. 운이 좋았네요!"}</p>
      <p class="sub" style="margin-top:14px">오늘의 칭호</p>
      <ol class="rank">${titles.map(t => `<li style="--c:#ffe6a6"><span><b style="color:var(--gold);font-weight:500">✦ ${t.name}</b></span><small style="color:var(--muted)">${t.desc}</small></li>`).join("")}</ol>
      <p class="sub" style="margin-top:14px">가장 많이 담은 물건</p>
      <ol class="rank">${top.length
        ? top.map(([id, n], i) => `<li style="--c:${colorOf(id)}"><span>${icon(itemById[id].icon, itemById[id].type === "refill")}${i + 1}. ${itemById[id].name}</span><small>${n}번</small></li>`).join("")
        : `<li><span>아직 담은 물건이 없어요</span></li>`}</ol>
      <a class="btn btn-serve" href="${MILE_LINK}" target="_blank" rel="noopener noreferrer">MILE 더 알아보기 ↗</a>
      <button class="btn btn-ghost" data-act="restart">처음 화면으로 돌아가기</button>`);
  };

  const showTitle = () => {
    showCard(`
      <div class="eyebrow">MILE FIRST STEP SHOP</div>
      ${planetSVG()}
      <h1>MILE 첫걸음 상점</h1>
      <p class="sub">은하수 기숙사의 학생들이 필요한 걸 찾아와요.<br>말 속에 숨은 힌트를 듣고, 딱 맞는 별빛 키트를 꾸려 주세요.</p><label for="playerNameInput" class="sub" style="display:block;text-align:left;margin-top:14px">점장 이름</label><input id="playerNameInput" class="player-name-input" maxlength="20" placeholder="이름을 입력해 줘" autocomplete="nickname" value="${escapeText(state.playerName)}">
      ${recordsMarkup(true)}
      <ul class="how">
        <li>진열대의 물건을 눌러 키트 상자에 담고, <b>건네기</b>를 눌러요.</li>
        <li><b>생활·세탁</b>, <b>청소·욕실</b>, <b>리필</b> 칸을 오가며 골라요. <b>리필 손님</b>은 리필 품목만 찾아요.</li>
        <li>너무 늦으면 손님이 떠나요. <b>기다리는 별빛</b>을 잘 봐 주세요.</li>
        <li>가게에 없는 걸 찾는 손님은 <b>이 가게 아니에요!</b>로 돌려보내요.</li>
        <li><b>진상 손님</b>에게는 응대 카드로 차분하게 대답하고, 지치면 <b>숨 고르기</b>로 마음을 돌봐요.</li>
        <li>연속으로 딱 맞게 건네면 <b>콤보</b>! ${COMBO.feverAt}콤보마다 <b>별똥별 피버</b>가 터져요.</li>
        <li>가끔 기숙사 고양이 <b>별이</b>가 놀러 와요. 쓰다듬어 주면 마음이 말랑해져요.</li>
      </ul>
      <p class="sub keys-hint">PC에서는 키보드로도 할 수 있어요 · 숫자 <kbd>1</kbd>~<kbd>8</kbd> 담기 · <kbd>Q</kbd><kbd>W</kbd><kbd>E</kbd> 칸 바꾸기 · <kbd>Enter</kbd> 건네기 · <kbd>X</kbd> 돌려보내기 · <kbd>C</kbd> 비우기 · <kbd>B</kbd> 숨 고르기</p>
      <button class="btn btn-serve" data-act="start">시작하기 ✦ <kbd>Enter</kbd></button>`);
  };

  // ── 입력 (휴대폰은 탭, PC는 클릭과 키보드) ──
  const toggleItem = (id, el) => {
    if (!state.running || state.paused) return;
    if (state.current?.cat) return toast("별이는 물건엔 관심이 없어요.", "간식이라면 모를까… 쓰다듬어 줄래요?");
    const at = state.box.indexOf(id);
    if (at >= 0) {
      state.box.splice(at, 1);
      sfx("drop");
    } else {
      state.box.push(id);
      state.fresh = id;
      sfx("pick");
      if (el) sparkle(el, colorOf(id));
    }
    renderBox();
  };

  const clearBox = () => {
    if (!state.running || state.paused || !state.box.length) return;
    state.box = [];
    sfx("drop");
    renderBox();
  };
  $("tabs").addEventListener("click", (e) => {
    const b = e.target.closest("[data-tab]");
    if (!b) return;
    state.tab = b.dataset.tab;
    renderShelf();
  });

  $("shelf").addEventListener("click", (e) => {
    const b = e.target.closest("[data-id]");
    if (b) toggleItem(b.dataset.id, b);
  });

  $("kitItems").addEventListener("click", (e) => {
    const b = e.target.closest("[data-id]");
    if (!b || !state.running || state.paused) return;
    toggleItem(b.dataset.id);
  });

  $("clearBtn").addEventListener("click", clearBox);
  $("avatar").addEventListener("click", petCat);
  $("recordsBtn").addEventListener("click", () => showRecords(true));
  $("soundBtn").addEventListener("click", () => {
    soundOn = !soundOn;
    try { localStorage.setItem("mileShopSound", soundOn ? "on" : "off"); } catch (e) {}
    renderSound();
    sfx("pick");
  });
  $("serveBtn").addEventListener("click", serve);
  $("wrongBtn").addEventListener("click", rejectCustomer);
  $("breathBtn").addEventListener("click", breathe);

  $("overlay").addEventListener("click", (e) => {
    const choice = e.target.closest("[data-choice]");
    if (choice && state.onChoice) return state.onChoice(Number(choice.dataset.choice));
    const act = e.target.closest("[data-act]")?.dataset.act;
    if (!act) return;
    if (act === "start") {
      const nameInput = $("playerNameInput");
      const enteredName = nameInput ? nameInput.value.trim() : state.playerName;
      if (!enteredName) {
        if (nameInput) { nameInput.focus(); nameInput.placeholder = "이름을 먼저 입력해 줘!"; }
        return;
      }
      state.playerName = enteredName.slice(0, 20);
      state.recordSaved = false;
      startRound(0);
    }
    else if (act === "open") { hideCard(); setTimeout(nextCustomer, 250); }
    else if (act === "next") startRound(state.round + 1);
    else if (act === "final") showFinal();
    else if (act === "closeRecords") { if (state.recordsReturnToGame) { hideCard(); state.paused = state.recordsWasPaused; } else showTitle(); }
    else if (act === "restart") {
      // 한 판을 마친 뒤 처음 화면으로 돌아가 새 이름을 입력하고 기록을 확인할 수 있게 해요.
      Object.assign(state, {
        round: 0, queue: [], index: 0, current: null, box: [],
        coins: 0, mile: 0, roundCoins: 0, roundMile: 0, roundStats: null,
        picks: {}, playerName: "", recordSaved: false, running: false, paused: false,
        copeGood: 0, copeTotal: 0, onChoice: null, combo: 0, fever: 0,
        stats: { perfects: 0, maxCombo: 0, strangeRight: 0, refillPerfect: 0, catPets: 0, breathsUsed: 0, left: 0 }
      });
      showTitle();
    }
  });

  // PC 키보드 단축키 (한글 입력 상태에서도 되도록 자판 위치로 판단)
  document.addEventListener("keydown", (e) => {
    if (e.repeat || e.metaKey || e.ctrlKey || e.altKey || e.isComposing || e.keyCode === 229) return;
    const code = e.code;
    // 입력창에서는 한글 조합과 일반 텍스트 입력을 방해하지 않도록 단축키를 실행하지 않음
    const active = document.activeElement;
    const isTextEntry = active && (
      active.matches("input, textarea, select") || active.isContentEditable
    );
    if (isTextEntry) return;
    // 마우스로 누른 버튼에 남은 포커스 때문에 같은 버튼이 한 번 더 눌리지 않도록
    if (active && active !== document.body) active.blur();
    const digit = /^(Digit|Numpad)([1-9])$/.exec(code);
    if (!$("overlay").hidden) {
      if (digit && state.onChoice) {
        const i = Number(digit[2]) - 1;
        if ($("card").querySelector(`[data-choice="${i}"]`)) state.onChoice(i);
        e.preventDefault();
      } else if (code === "Enter" || code === "NumpadEnter" || code === "Space") {
        const primary = $("card").querySelector('[data-act]:not([data-act="restart"])');
        if (primary) { primary.click(); e.preventDefault(); }
      }
      return;
    }
    const tabKeys = { KeyQ: 0, KeyW: 1, KeyE: 2, KeyR: 3 };
    const shelfKeys = Object.keys(SHELVES);
    if (digit) {
      const list = ITEMS.filter(i => i.shelf === state.tab);
      const item = list[Number(digit[2]) - 1];
      if (item) toggleItem(item.id, $("shelf").querySelector(`[data-id="${item.id}"]`));
    } else if (code in tabKeys && shelfKeys[tabKeys[code]]) {
      state.tab = shelfKeys[tabKeys[code]];
      renderShelf();
    } else if (code === "ArrowRight" || code === "ArrowLeft") {
      const i = shelfKeys.indexOf(state.tab) + (code === "ArrowRight" ? 1 : -1);
      state.tab = shelfKeys[(i + shelfKeys.length) % shelfKeys.length];
      renderShelf();
    } else if (code === "Enter" || code === "NumpadEnter" || code === "Space") serve();
    else if (code === "KeyX") rejectCustomer();
    else if (code === "KeyC" || code === "Backspace") clearBox();
    else if (code === "KeyB") breathe();
    else return;
    e.preventDefault();
  });

  // ── 기다림 타이머 ──
  let last = performance.now();
  const loop = (now) => {
    const dt = Math.min((now - last) / 1000, .1);
    last = now;
    const c = state.current;
    if (state.running && !state.paused) {
      state.patience -= dt * (c.drain || 1);
      updatePatience();
      if (c.event?.timing === "mid" && !c.eventDone && state.patience / state.patienceMax < .62) triggerMidEvent(c);
      else if (state.patience <= 0) timeout();
    }
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);

  renderSound();
  setButtons(false);
  renderShelf();
  renderBox();
  renderHud();
  showTitle();
})();
</script>
</body>
</html>
